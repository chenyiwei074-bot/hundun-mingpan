# hundun nginx config
upstream frontend {
    server 127.0.0.1:3001;
}

upstream backend {
    server 127.0.0.1:3000;
}

server {
    server_name hundunmp.vip www.hundunmp.vip;

    access_log /var/log/nginx/hundun-access.log;
    error_log  /var/log/nginx/hundun-error.log;
    client_max_body_size 20m;

    location /_next/static {
        alias /opt/frontend/.next/standalone/.next/static;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public {
        alias /opt/frontend/public;
        expires 7d;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_hide_header Cache-Control;
        proxy_hide_header x-nextjs-cache;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/hundunmp.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hundunmp.vip/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.hundunmp.vip) {
        return 301 https://$host$request_uri;
    }
    if ($host = hundunmp.vip) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name hundunmp.vip www.hundunmp.vip;
    return 404;
}
