name: Deploy to Alibaba Cloud (frontend-first, fail-safe)

# 2026-10-16 加固（运维侧）：原版有三个硬伤
#   ① 无条件 `git reset --hard origin/main` → 冲掉 /opt 上所有未提交的生产改动（Qoder 视觉重构、真太阳时、安全修复都曾在此状态）
#   ② 无条件 `pm2 restart hundun-api` → 后端没变也重启，违反"只换皮不碰后端"
#   ③ 前端**先 pm2 stop 后 build** → build 失败网站就停在停止态、无自动回滚
# 现在：先做未提交改动守卫（有则中止）→ 快照 → 按变更范围重建 → 前端先构建成功再切换 → 健康检查失败自动回滚。

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            STAMP=$(date +%Y%m%d-%H%M%S)
            BK=/srv/chaos/export/deploy-$STAMP
            mkdir -p "$BK"
            cd /opt

            echo "===== [1/6] 守卫：拒绝覆盖未提交的已跟踪改动 ====="
            DIRTY=$(git status --porcelain --untracked-files=no)
            if [ -n "$DIRTY" ]; then
              echo "ERROR: /opt 存在未提交的已跟踪改动，拒绝部署（reset --hard 会冲掉它们）"
              echo "$DIRTY" | sed 's/^/    /'
              echo "处理方式：先把这些改动并入仓库（或由运维手工部署），再触发部署。"
              exit 1
            fi
            # OLD 用「上一次成功部署的版本」而非 HEAD：/opt 是运维与 CI 共用的仓库，
            # 运维在服务器上 merge/pull 之后 HEAD 会提前指向新版本，用 HEAD 当基线会导致增量为 0、静默跳过构建。
            STATE_DIR=/srv/chaos/state
            mkdir -p "$STATE_DIR"
            OLD=$(cat "$STATE_DIR/deployed-rev" 2>/dev/null || true)
            if [ -z "$OLD" ] || ! git cat-file -e "$OLD^{commit}" 2>/dev/null; then
              OLD=$(git rev-parse HEAD)
            fi
            if ! git merge-base --is-ancestor "$OLD" origin/main 2>/dev/null; then
              echo "    WARN: 已部署版本 $OLD 不是 origin/main 的祖先，按全量重建处理"
              OLD=$(git rev-parse origin/main^ 2>/dev/null || git rev-parse HEAD)
            fi

            echo "===== [2/6] 快照 + 拉取（$OLD）====="
            # 快照保留源码即可：排除 .git（体积最大且无需快照）、.next*、node_modules、日志与大 tar
            tar -czf "$BK/opt-src-$STAMP.tar.gz" \
              --exclude=.git --exclude=node_modules --exclude=.next --exclude=.next.prev* \
              --exclude=logs --exclude='*.tar.gz' --exclude='*.tar' --exclude='*.log' \
              --exclude=hermes-python --exclude=hermes-venv --exclude=eval-tools --exclude=.venv --exclude=venv-ots \
              --exclude=uploads --exclude=dist --exclude=.cache --exclude=node \
              -C /opt . 2>/dev/null || true
            # 保留最近 5 份部署备份，避免磁盘被快照堆满
            ls -dt /srv/chaos/export/deploy-* 2>/dev/null | tail -n +6 | xargs -r rm -rf
            git fetch origin
            git reset --hard origin/main
            NEW=$(git rev-parse HEAD)
            echo "    $OLD -> $NEW"

            BACKEND_CHANGED=$(git diff --name-only "$OLD" "$NEW" -- server/ | wc -l | tr -d ' ')
            FRONTEND_CHANGED=$(git diff --name-only "$OLD" "$NEW" -- frontend/ | wc -l | tr -d ' ')
            LOCK_CHANGED=$(git diff --name-only "$OLD" "$NEW" -- server/package-lock.json frontend/package-lock.json | wc -l | tr -d ' ')
            echo "    变更文件：后端 $BACKEND_CHANGED / 前端 $FRONTEND_CHANGED / lock $LOCK_CHANGED"

            if [ "$BACKEND_CHANGED" -gt 0 ]; then
              echo "===== [3/6] 后端构建并重启（有变更）====="
              cd /opt/server
              if [ "$LOCK_CHANGED" -gt 0 ]; then npm ci --production=false; fi
              npx prisma generate
              npm run build
              pm2 restart hundun-api
              echo "    OK: API restarted"
            else
              echo "===== [3/6] 后端无变更，跳过构建与重启 ====="
            fi

            if [ "$FRONTEND_CHANGED" -eq 0 ]; then
              echo "===== [4/6] 前端无变更，跳过 ====="
            else
              echo "===== [4/6] 前端：先构建，成功后才切换 ====="
              cd /opt/frontend
              if [ "$LOCK_CHANGED" -gt 0 ]; then npm ci --production=false; fi
              rm -rf .next.prev
              if [ -d .next ]; then mv .next .next.prev; fi
              if npm run build; then
                echo "    build OK"
                pm2 restart hundun-web
              else
                echo "ERROR: 前端构建失败 → 回滚到上一版构建"
                rm -rf .next
                if [ -d .next.prev ]; then mv .next.prev .next; fi
                pm2 restart hundun-web || true
                exit 1
              fi
            fi

            echo "===== [5/6] 健康检查 ====="
            sleep 5
            API=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
            WEB=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/ || true)
            echo "    API=$API  WEB=$WEB"
            if [ "$API" != "200" ] || [ "$WEB" != "200" ]; then
              echo "ERROR: 健康检查未通过 → 前端回滚到上一版构建"
              cd /opt/frontend
              rm -rf .next
              if [ -d .next.prev ]; then mv .next.prev .next; fi
              pm2 restart hundun-web || true
              exit 1
            fi
            echo "$NEW" > "$STATE_DIR/deployed-rev"
            echo "===== [6/6] DEPLOY DONE ($NEW) ====="
